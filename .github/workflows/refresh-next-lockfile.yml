name: Refresh patched Next.js lockfile

on:
  push:
    branches:
      - "security/next-15-2-8"

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Regenerate only the pnpm lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Save the generated lockfile
        run: |
          rm -f .github/workflows/refresh-next-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml .github/workflows/refresh-next-lockfile.yml
          if git diff --cached --quiet; then
            echo "No lockfile changes were needed."
            exit 0
          fi
          git commit -m "fix: update Next.js security lockfile"
          git push origin "HEAD:$BRANCH_NAME"
