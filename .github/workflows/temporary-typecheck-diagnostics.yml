name: Diagnose production typecheck

on:
  push:
    branches:
      - "security/next-15-2-8-main-ready"

permissions:
  contents: write

jobs:
  typecheck:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture TypeScript diagnostics
        run: |
          set +e
          pnpm typecheck > /tmp/typecheck.log 2>&1
          status=$?
          cat /tmp/typecheck.log
          if [ "$status" -ne 0 ]; then
            tail -n 80 /tmp/typecheck.log | while IFS= read -r line; do echo "::error title=typecheck::$line"; done
          fi
          exit $status
      - name: Remove temporary typecheck workflow
        if: always()
        run: |
          rm -f .github/workflows/temporary-typecheck-diagnostics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/temporary-typecheck-diagnostics.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: remove temporary typecheck diagnostics"
          git push origin "HEAD:$GITHUB_REF_NAME"
