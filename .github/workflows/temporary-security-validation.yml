name: Temporary Next.js security validation

on:
  push:
    branches:
      - "security/next-15-2-8-main-ready"

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-placeholder
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      ADMIN_DISCORD_IDS: "123456789012345678"
      APP_URL: https://example.invalid
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Fix and verify the Next.js lockfile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("pnpm-lock.yaml")
          text = path.read_text()
          old = "      next: 15.2.4(react-dom@19.0.0(react@19.0.0))(react@19.0.0)"
          new = "      next: 15.2.8(react-dom@19.0.0(react@19.0.0))(react@19.0.0)"
          if text.count(old) != 1:
              raise SystemExit("Expected one stale next-auth peer resolution, found " + str(text.count(old)))
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - name: Remove temporary validation workflow
        if: always()
        run: |
          rm -f .github/workflows/temporary-security-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/temporary-security-validation.yml pnpm-lock.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: complete Next.js lockfile and remove temporary workflow"
          git push origin "HEAD:$GITHUB_REF_NAME"
